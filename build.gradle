plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'com.google.cloud.tools.jib' version '3.3.2'
}

group = 'com.finlink'
version = '1.0.0'
sourceCompatibility = '1.8'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // BCrypt Password Hashing
    implementation 'org.mindrot:jbcrypt:0.4'

    // MyBatis-Plus
    implementation 'com.baomidou:mybatis-plus-boot-starter:3.5.5'

    // Apache Shiro
    implementation 'org.apache.shiro:shiro-spring-boot-web-starter:1.13.0'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'

    // Apache Commons Collections4
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    // EasyExcel
    implementation 'com.alibaba:easyexcel:3.3.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ==================== Jib 一键推送镜像配置 ====================
jib {
    from {
        image = 'eclipse-temurin:8-jre-alpine'
    }
    to {
        image = 'crpi-otuh3k08p4yxr3tv.cn-shanghai.personal.cr.aliyuncs.com/finlink/finlink:1.0.0'
        auth {
            username = '稚名不带撇'
            password = '@Hf173503494'
        }
    }
    container {
        ports = ['10030']
        environment = ['SPRING_PROFILES_ACTIVE': 'prd']
        jvmFlags = ['-Xms256m', '-Xmx512m', '-Dfile.encoding=UTF-8']
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}